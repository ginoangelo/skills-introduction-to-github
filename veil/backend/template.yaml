AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Veil privacy app backend (breach scan API, accounts, synced progress).

Parameters:
  HibpApiKeyParameterName:
    Type: String
    Default: veil/hibp-api-key
    Description: >-
      Name (without the leading slash) of the SSM Parameter Store SecureString holding your
      Have I Been Pwned API key. Create it before deploying; see veil/README.md.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Web origin allowed by CORS (only matters for the web build of the app).

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [content-type, authorization]
      # Every route requires a signed-in user unless it opts out (see /scan).
      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
      # Basic abuse protection: at most 10 requests/second, bursts of 20, across all users.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20

  # Accounts: sign up with email + password, email verification code.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: veil-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: veil-mobile
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      RefreshTokenValidity: 30

  UserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ScanCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: scan.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ScanCacheTable
          HIBP_KEY_PARAM: !Sub /${HibpApiKeyParameterName}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScanCacheTable
        - SSMParameterReadPolicy:
            ParameterName: !Ref HibpApiKeyParameterName
      Events:
        Scan:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /scan
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/handlers/scan.ts
        External:
          - '@aws-sdk/*'

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: me.handler
      Environment:
        Variables:
          USER_TABLE_NAME: !Ref UserTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserTable
      Events:
        GetProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /me/progress
            Method: GET
        PutProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /me/progress
            Method: PUT
        DeleteMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /me
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/handlers/me.ts
        External:
          - '@aws-sdk/*'

Outputs:
  ApiUrl:
    Description: Put this in veil/mobile/.env.local as EXPO_PUBLIC_API_URL
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  CognitoRegion:
    Description: Put this in veil/mobile/.env.local as EXPO_PUBLIC_COGNITO_REGION
    Value: !Ref AWS::Region
  UserPoolClientId:
    Description: Put this in veil/mobile/.env.local as EXPO_PUBLIC_COGNITO_CLIENT_ID
    Value: !Ref UserPoolClient
