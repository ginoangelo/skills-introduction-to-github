AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Veil privacy app backend (breach scan API).

Parameters:
  HibpApiKeyParameterName:
    Type: String
    Default: veil/hibp-api-key
    Description: >-
      Name (without the leading slash) of the SSM Parameter Store SecureString holding your
      Have I Been Pwned API key. Create it before deploying; see veil/README.md.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Web origin allowed by CORS (only matters for the web build of the app).

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
      # Basic abuse protection: at most 10 requests/second, bursts of 20, across all users.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20

  ScanCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: scan.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ScanCacheTable
          HIBP_KEY_PARAM: !Sub /${HibpApiKeyParameterName}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScanCacheTable
        - SSMParameterReadPolicy:
            ParameterName: !Ref HibpApiKeyParameterName
      Events:
        Scan:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /scan
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - src/handlers/scan.ts
        External:
          - '@aws-sdk/*'

Outputs:
  ApiUrl:
    Description: Put this in veil/mobile/.env.local as EXPO_PUBLIC_API_URL
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
