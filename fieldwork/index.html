<title>Fieldwork</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: a bold, outlined workspace. Black sidebar for the app; a project header with pill tabs;
   sources on the left, work on the right. One soft, natural blue is the only accent color; evidence highlights use a light tint of it. */
:root {
  --bg: #f4f4f0; --panel: #ffffff; --ink: #000000; --muted: #57574f; --line: #000000; --hair: #d8d8d0; --soft: #ececE5;
  --accent: #a9c6e3; --accent-soft: #dde9f5; --accent-strong: #35618c; --accent-ink: #000000; --ok: #10823a; --warn: #b54708; --side: #000000; --side-ink: #ffffff; --side-dim: #9b9b93;
  --hl: #cfe0f2; --hl-ink: #000000;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0b0a; --panel: #151513; --ink: #f4f4f0; --muted: #a8a89f; --line: #f4f4f0; --hair: #33332f; --soft: #1f1f1c;
  --ok: #4ade80; --warn: #fdba74; --side: #000000; --side-ink: #f4f4f0; --side-dim: #8a8a82; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b0b0a; --panel: #151513; --ink: #f4f4f0; --muted: #a8a89f; --line: #f4f4f0; --hair: #33332f; --soft: #1f1f1c;
  --ok: #4ade80; --warn: #fdba74; --side: #000000; --side-ink: #f4f4f0; --side-dim: #8a8a82; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--body); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.shell { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; }
/* Sidebar */
.sidebar { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line);
  padding-left: env(safe-area-inset-left, 0px); }
.wordmark { display: flex; align-items: center; gap: 10px; padding: 26px 20px; font: 700 23px/1 var(--display); letter-spacing: -.03em; border-bottom: 1px solid #2a2a27; }
.wordmark svg { width: 22px; height: 22px; }
.navi { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-bottom: 1px solid #2a2a27; background: none; color: var(--side-ink); padding: 15px 20px; text-align: left; font-weight: 500; }
.navi svg { width: 17px; height: 17px; flex: none; }
.navi:hover { background: #151513; }
.navi[aria-current="page"] { color: var(--accent); }
.navsp { flex: 1; }
.pkgsw { padding: 14px 16px; border-top: 1px solid #2a2a27; display: grid; gap: 8px; }
.pkgsw > span { font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--side-dim); }
.seg { display: flex; border: 1px solid #f4f4f0; border-radius: 999px; padding: 2px; }
.seg button { flex: 1; border: 0; background: none; color: inherit; border-radius: 999px; padding: 6px 8px; font-size: 12.5px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #000; }
.me { display: flex; gap: 10px; align-items: center; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid #2a2a27; }
.me b { display: block; font-size: 13px; } .me small { color: var(--side-dim); font-size: 12px; }
.av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #000; display: grid; place-items: center; font: 700 12px/1 var(--display); flex: none; border: 1px solid #000; }

/* Main */
.mainwrap { min-width: 0; display: flex; flex-direction: column; }
.phead { border-bottom: 1px solid var(--line); padding-block: 26px 0; padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; background: var(--bg); }
.ptitle { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.ptitle h1, .pagetitle h1 { margin: 0; font: 700 34px/1.05 var(--display); letter-spacing: -.03em; text-wrap: balance; }
.sp { flex: 1; }
.tabs { display: flex; gap: 8px; padding-bottom: 16px; overflow-x: auto; }
.tabs button { border: 1px solid transparent; background: none; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.tabs button:hover { border-color: var(--line); }
.tabs button[aria-selected="true"] { border-color: var(--line); background: var(--panel); }
.tabs i { font-style: normal; font: 500 11px/1 var(--mono); background: var(--accent); color: #000; border-radius: 999px; padding: 3px 7px; border: 1px solid #000; }
.work { display: grid; grid-template-columns: 300px minmax(0, 1fr); flex: 1; }
.work.full { grid-template-columns: minmax(0, 1fr); }
.srccol { border-right: 1px solid var(--line); padding: 22px 20px; display: grid; gap: 14px; align-content: start; }
.pane { padding: 28px 32px 48px; padding-right: max(32px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; min-width: 0; }

.eyebrow { font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h2 { margin: 0; font: 700 26px/1.15 var(--display); letter-spacing: -.02em; text-wrap: balance; }
h3 { margin: 0; font: 700 16px/1.3 var(--display); letter-spacing: -.01em; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row .sp { flex: 1; }
.verified { color: var(--ok); }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 10px 16px; font-weight: 600; font-size: 13.5px; transition: transform .12s, box-shadow .12s; }
.btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--line); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.accent { background: var(--accent); color: #000; border-color: #000; }
.btn:disabled { opacity: .5; cursor: default; }

/* Sources */
.srclist { display: grid; gap: 8px; }
.src { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 10px 12px; }
.src:hover { box-shadow: 3px 3px 0 var(--line); transform: translate(-1px, -1px); }
.src.on { background: var(--accent); color: #000; }
.src.on small { color: #3a3a35; }
.src b { font-weight: 600; font-size: 13px; }
.src small { grid-column: 1; font: 400 11.5px/1.3 var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src .n { grid-row: 1 / 3; grid-column: 2; align-self: center; font: 600 11px/1 var(--mono); border: 1px solid currentColor; border-radius: 999px; padding: 3px 7px; }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 13px; border-top: 1px solid var(--line); padding-top: 12px; }
.stat span:nth-child(even) { font: 600 13px/1.4 var(--mono); text-align: right; }

/* Lens */
.lens { display: grid; grid-template-columns: minmax(0, 1fr) 280px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.reading { max-width: 70ch; display: grid; gap: 14px; padding: 28px 32px; border-right: 1px solid var(--line); }
.reading .url { font: 400 12px/1 var(--mono); color: var(--muted); }
.reading p { margin: 0; font-size: 16px; line-height: 1.75; }
.reading p.head { font: 700 20px/1.3 var(--display); }
mark { background: var(--hl); color: var(--hl-ink); border-radius: 2px; padding: 0 2px; cursor: pointer; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
mark.flash { outline: 2px solid var(--ink); outline-offset: 1px; }
.keys { display: grid; gap: 10px; align-content: start; padding: 22px 20px; background: var(--bg); }
.key { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; display: grid; gap: 4px; font-size: 13px; background: var(--panel); }
.key .t { font: 600 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

/* Extract */
.templates { display: flex; flex-wrap: wrap; gap: 8px; }
.tpl { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; }
.tpl.on { background: var(--accent); color: #000; }
#req { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; background: var(--panel); font-size: 16px; line-height: 1.55; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--panel); }
.steps { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.steps div { display: flex; gap: 10px; align-items: center; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--hair); }
.steps div:last-child { border-bottom: 0; }
.steps div.done { color: var(--ink); } .steps div.done b { color: var(--ok); }
.steps div.now { background: var(--accent); color: #000; font-weight: 600; }
.steps b { width: 16px; text-align: center; }
.msg { border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; background: var(--panel); font-size: 13.5px; }
.msg.err { color: var(--warn); }

/* Datasets */
.objtabs { display: flex; flex-wrap: wrap; gap: 8px; }
.objtab { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.objtab span { font: 600 11px/1 var(--mono); }
.objtab[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 13.5px; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--hair); vertical-align: top; }
th { font: 600 10.5px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--line); }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 30%, transparent); cursor: pointer; }
tr:last-child td { border-bottom: 0; }
td.ev { max-width: 320px; color: var(--muted); font-size: 12.5px; }
td.ev b { display: block; font: 600 11px/1.5 var(--mono); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.nf { color: var(--muted); font-style: italic; }

/* Deliverable */
.deliv { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.report { display: grid; gap: 16px; padding: 32px 36px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); box-shadow: 6px 6px 0 var(--line); }
.report .sum { font-size: 16px; line-height: 1.7; margin: 0; max-width: 68ch; }
.report ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 5px; max-width: 68ch; }
.export { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); position: sticky; top: 16px; overflow: hidden; }
.export h3 { background: var(--ink); color: var(--bg); padding: 14px 16px; }
.export .btn { display: flex; justify-content: space-between; align-items: center; border: 0; border-bottom: 1px solid var(--hair); border-radius: 0; padding: 14px 16px; text-align: left; }
.export .btn:hover { transform: none; box-shadow: none; background: var(--accent); color: #000; }
.export .btn small { font: 600 11px/1 var(--mono); border: 1px solid currentColor; border-radius: 999px; padding: 3px 8px; }
.export .note { padding: 12px 16px; }
.slides { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.slide { aspect-ratio: 16 / 9; max-width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 10px; display: grid; align-content: start; gap: 4px; overflow: hidden; background: var(--panel); }
.slide b { font: 700 11px/1.2 var(--display); }
.slide span { font-size: 8.5px; line-height: 1.35; color: var(--muted); }
.slide.title { background: var(--ink); color: var(--bg); align-content: end; }
.slide.title span { color: var(--bg); opacity: .75; }
.flash { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.fc { border: 1px solid var(--line); border-radius: 4px; padding: 16px; min-height: 120px; display: grid; gap: 8px; align-content: start; text-align: left; background: var(--panel); font-weight: 500; }
.fc:hover { box-shadow: 3px 3px 0 var(--line); transform: translate(-1px, -1px); }
.fc .t { font: 600 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.fc.flipped { background: var(--accent); color: #000; }
.fc.flipped .t { color: #3a3a35; }
.cmp td:first-child { font-weight: 700; }

/* Scrapbook */
.scrapbar { gap: 14px; }
.layouts { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.layouts button { border: 0; background: none; border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 13px; }
.layouts button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.groupby { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.groupby select { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; background: var(--panel); }
.snip { display: grid; gap: 8px; text-align: left; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 12px 14px; font-size: 13.5px; line-height: 1.45; width: 100%; transition: transform .12s, box-shadow .12s; }
.snip:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--line); }
.sbig { font: 700 24px/1 var(--display); letter-spacing: -.02em; }
.smeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.stype { font: 600 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; background: var(--accent-soft); color: #000; border: 1px solid var(--line); border-radius: 999px; padding: 4px 7px; }
.ev { font: 500 11px/1.3 var(--mono); color: var(--muted); }
.ev.verified { color: var(--ok); } .ev.check { color: var(--warn); }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 16px; overflow-x: auto; padding-bottom: 6px; align-items: start; }
.col { border: 1px solid var(--line); border-radius: 4px; background: var(--bg); display: grid; gap: 10px; padding: 0 12px 12px; }
.col header { display: flex; justify-content: space-between; align-items: center; margin: 0 -12px; padding: 12px; border-bottom: 1px solid var(--line); background: var(--accent); color: #000; }
.col header .chip { background: var(--panel); color: var(--ink); }
.notebook { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 32px 40px; display: grid; gap: 18px; max-width: 820px; box-shadow: 6px 6px 0 var(--line); }
.notebook ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; line-height: 1.6; }
.notebook li[data-snip] { cursor: pointer; }
.notebook li[data-snip]:hover { background: var(--hl); color: #000; }
.notebook sup { font: 600 10px var(--mono); color: var(--accent-strong); margin-left: 2px; }
.notebook .notes ol { margin: 8px 0 0; padding-left: 20px; font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
.notebook .notes { border-top: 1px solid var(--line); padding-top: 14px; }
.pins { columns: 4 220px; column-gap: 16px; }
.pin { break-inside: avoid; margin-bottom: 16px; }
.pin.hasbig { background: var(--accent-soft); }
#snipSel { display: inline-flex; gap: 6px; align-items: center; }

/* Home: project and template cards */
.pagetitle { display: grid; gap: 8px; }
.pagetitle p { margin: 0; color: var(--muted); font-size: 15px; max-width: 60ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.pcard { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); text-align: left; padding: 0; display: grid; grid-template-rows: auto 1fr; overflow: hidden; transition: transform .12s, box-shadow .12s; }
.pcard:hover { transform: translate(-3px, -3px); box-shadow: 5px 5px 0 var(--line); }
.cover { height: 150px; border-bottom: 1px solid var(--line); position: relative; display: grid; place-items: center; font: 700 44px/1 var(--display); letter-spacing: -.04em; overflow: hidden; }
.c-pro { background: repeating-linear-gradient(-45deg, var(--accent) 0 14px, var(--accent-soft) 14px 28px); color: #000; }
.c-student { background: radial-gradient(#000 1.6px, transparent 1.8px) 0 0 / 16px 16px, #fff; color: #000; }
.c-tpl { background: #000; color: var(--accent); }
.ptag { letter-spacing: .02em; position: absolute; left: 12px; bottom: 12px; background: var(--accent); color: #000; border: 1px solid #000; font: 700 12px/1 var(--mono); padding: 6px 16px 6px 10px; clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%); }
.pbody { padding: 16px 18px 18px; display: grid; gap: 6px; align-content: start; }
.pmeta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.chip { font: 600 11px/1 var(--mono); border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; background: var(--panel); }
.chip.on { background: var(--accent); color: #000; border-color: #000; }

/* Account */
.phero { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 24px; }
.av.big { width: 76px; height: 76px; font-size: 24px; }
.phero h2 { font-size: 30px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.box { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 18px 20px; display: grid; gap: 12px; align-content: start; }
.meter { height: 12px; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--bg); }
.meter i { display: block; height: 100%; background: var(--accent); border-right: 1px solid #000; }
.kvs { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 13.5px; }
.kvs span:nth-child(even) { font-weight: 600; text-align: right; }
.list { display: grid; gap: 0; }
.list div { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px; }
.list div:last-child { border-bottom: 0; }

/* Checkout */
.billsw { max-width: 340px; border-color: var(--line); }
.billsw button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.billsw em { font-style: normal; font: 600 10px/1 var(--mono); background: var(--accent); color: #000; border-radius: 999px; padding: 2px 6px; margin-left: 4px; }
.checkout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.plancard { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); padding: 22px; display: grid; gap: 14px; align-content: start; text-align: left; transition: transform .12s, box-shadow .12s; }
.plancard:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--line); }
.plancard[aria-pressed="true"] { box-shadow: 6px 6px 0 var(--line); background: color-mix(in srgb, var(--accent) 22%, var(--panel)); }
.price { font: 700 40px/1 var(--display); letter-spacing: -.03em; }
.price small { font: 500 14px var(--body); color: var(--muted); letter-spacing: 0; }
.plancard ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 13.5px; }
.plancard li { display: flex; gap: 8px; } .plancard li::before { content: "✓"; font-weight: 700; }
.summary { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); display: grid; position: sticky; top: 16px; overflow: hidden; }
.summary h3 { background: var(--ink); color: var(--bg); padding: 14px 18px; }
.summary .in { padding: 18px; display: grid; gap: 14px; }
.total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 12px; font-weight: 700; }
.total b { font: 700 24px/1 var(--display); }
.paybox { border: 1px dashed var(--line); border-radius: 4px; padding: 14px; font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.paybox b { color: var(--ink); }

dialog { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); width: min(620px, calc(100% - 32px)); padding: 24px; box-shadow: 8px 8px 0 var(--line); }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog form { display: grid; gap: 14px; }
dialog label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
dialog input, dialog textarea { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; background: var(--bg); font-weight: 400; }
dialog textarea { min-height: 180px; resize: vertical; font-size: 13.5px; }

const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

function saveProject() { store.set("fw-proj-" + pkg, project); }

/* ---------- Evidence check: does the quote really appear on the page? ---------- */
const norm = s => String(s || "").toLowerCase().replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/\s+/g, " ").trim();
function verifyAll() {
  const r = project.result; if (!r) return;
  Object.values(r.objects || {}).forEach(rows => rows.forEach(row => { const s = project.sources.find(x => x.id === row.source); row.verified = !!(s && row.quote && norm(s.text).includes(norm(row.quote))); }));
}
const allRows = () => Object.values(project.result?.objects || {}).flat();

/* ---------- Scrapbook: one set of snips, four layouts ---------- */
const LAYOUTS = { table: "Table", board: "Board", notebook: "Notebook", pins: "Pin board" };
const RECOMMEND = { pro: { layout: "board", group: "company", why: "Board grouped by company is recommended for comparing competitors." }, student: { layout: "notebook", group: "topic", why: "Notebook grouped by topic is recommended for building a paper." } };
const srcCompany = id => (project.sources.find(s => s.id === id)?.title || "Your snips").split(":")[0].trim();
function snipLabel(t, r) {
  const L = {
    company: () => `${r.name}: ${r.tagline}`, product: () => `${r.name}: ${r.description}`,
    price: () => `${r.plan}: ${r.price} ${r.period}${r.per_serving && r.per_serving !== "not found" ? ` (${r.per_serving} per serving)` : ""}`,
    feature: () => r.feature, claim: () => `${r.claim}. ${r.proof}`,
    source: () => r.citation, fact: () => r.statement, term: () => `${r.term}: ${r.definition}`, question: () => `${r.question} ${r.answer}` };
  return (L[t] || (() => r.quote))();
}
function bigOf(t, r) {
  if (t === "price") return r.price;
  if (t === "fact" || t === "claim") { const ms = String(t === "fact" ? r.statement : r.proof).match(/\$?\d[\d,.]*\s?(%|km|million)?/g) || []; return ms.map(x => x.trim()).sort((a, b) => parseFloat(b.replace(/[^\d.]/g, "")) - parseFloat(a.replace(/[^\d.]/g, "")))[0] || ""; }
  return "";
}
function allSnips() {
  const out = [];
  Object.entries(project.result?.objects || {}).forEach(([t, rows]) => rows.forEach((r, i) => out.push({ id: t + i, t, r, text: snipLabel(t, r), big: bigOf(t, r), type: PKGS[pkg].objects[t]?.label || t })));
  (project.snips || []).forEach((s, i) => out.push({ id: "m" + i, t: "snip", r: { source: s.source, quote: s.text, verified: true }, text: s.text, big: "", type: "Your snip", manual: true }));
  return out;
}
function groupOf(s) {
  const g = ui.groupBy || RECOMMEND[pkg].group;
  if (g === "type") return s.type;
  if (g === "source") return srcTitle(s.r.source);
  if (g === "company") return s.r.company || s.r.name || srcCompany(s.r.source);
  return s.r.topic || (s.t === "term" ? "Key terms" : s.t === "question" ? "Review questions" : s.t === "source" ? "Sources" : "Your snips");
}
function grouped(snips) { const m = new Map(); snips.forEach(s => { const g = groupOf(s); if (!m.has(g)) m.set(g, []); m.get(g).push(s); }); return [...m.entries()]; }
const evBadge = s => `<span class="ev ${s.r.verified ? "verified" : "check"}">${s.r.verified ? "✓" : "⚠"} ${esc(srcTitle(s.r.source))}</span>`;
function snipCard(s, cls = "snip") { return `<button class="${cls}" data-snip="${s.id}">${s.big ? `<span class="sbig">${esc(s.big)}</span>` : ""}<span class="stxt">${esc(s.text)}</span><span class="smeta"><span class="stype">${esc(s.type)}</span>${evBadge(s)}</span></button>`; }
function renderScrap() {
  const groupOpts = pkg === "pro" ? { company: "Company", source: "Page", type: "Type" } : { topic: "Topic", source: "Source", type: "Type" };
  if (ui.groupBy && !groupOpts[ui.groupBy]) ui.groupBy = null;
  const snips = allSnips(), lay = ui.layout || RECOMMEND[pkg].layout, grp = ui.groupBy || RECOMMEND[pkg].group;
  let body = "";
  if (!snips.length) body = `<p class="note">No snips yet. Run Extract, or select text in the Lens and press Snip.</p>`;
  else if (lay === "table") body = `<div class="tablewrap"><table><thead><tr><th>${esc(groupOpts[grp] || "Group")}</th><th>Snip</th><th>Type</th><th>Evidence</th></tr></thead><tbody>${grouped(snips).flatMap(([g, ss]) => ss.map(s => `<tr data-snip="${s.id}"><td><b>${esc(g)}</b></td><td>${esc(s.text)}</td><td>${esc(s.type)}</td><td class="ev">${evBadge(s)}<br>“${esc(s.r.quote)}”</td></tr>`)).join("")}</tbody></table></div>`;
  else if (lay === "board") body = `<div class="board">${grouped(snips).map(([g, ss]) => `<section class="col"><header><h3>${esc(g)}</h3><span class="chip">${ss.length}</span></header>${ss.map(s => snipCard(s)).join("")}</section>`).join("")}</div>`;
  else if (lay === "notebook") { let n = 0; const notes = [];
    body = `<article class="notebook"><div class="eyebrow">Notebook · ${esc(project.name)}</div><h2>${esc(project.result?.deliverable?.title || project.name)}</h2>${grouped(snips).map(([g, ss]) => `<section><h3>${esc(g)}</h3><ul>${ss.map(s => { notes.push(s); n++; return `<li data-snip="${s.id}">${esc(s.text)}<sup>${n}</sup></li>`; }).join("")}</ul></section>`).join("")}
    <section class="notes"><h3>Sources for each note</h3><ol>${notes.map(s => `<li>${esc(srcTitle(s.r.source))}: “${esc(s.r.quote)}”</li>`).join("")}</ol></section></article>`; }
  else body = `<div class="pins">${snips.map(s => snipCard(s, "snip pin" + (s.big ? " hasbig" : ""))).join("")}</div>`;
  $("#pane").innerHTML = `<div class="row"><h2>Scrapbook</h2><span class="sp"></span><button class="btn" data-exp="snips">Download snips (CSV)</button></div>
  <div class="row scrapbar"><div class="layouts" role="group" aria-label="Layout">${Object.entries(LAYOUTS).map(([k, v]) => `<button data-layout="${k}" aria-pressed="${k === lay}">${v}${k === RECOMMEND[pkg].layout ? " ★" : ""}</button>`).join("")}</div>
  ${lay !== "pins" ? `<label class="groupby">Group by <select id="groupBy">${Object.entries(groupOpts).map(([k, v]) => `<option value="${k}"${k === grp ? " selected" : ""}>${v}</option>`).join("")}</select></label>` : ""}
  <span class="note">${snips.length} snips · ★ ${esc(RECOMMEND[pkg].why)}</span></div>${body}`;
}

function renderLens() {
  const s = project.sources.find(x => x.id === ui.src) || project.sources[0]; if (!s) { $("#pane").innerHTML = `<p class="note">Add a page to start.</p>`; return; }
  const rows = Object.entries(project.result?.objects || {}).flatMap(([t, rs]) => rs.filter(r => r.source === s.id).map(r => ({ t, r })));
  let text = esc(s.text);
  rows.filter(x => x.r.verified).map(x => x.r.quote).sort((a, b) => b.length - a.length).forEach(q => {
    const eq = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    text = text.replace(new RegExp("(?![^<]*>)" + eq), m => `<mark data-q="${esc(q)}">${m}</mark>`);
  });
  const paras = text.split("\n").map((l, i) => `<p class="${i === 0 ? "head" : ""}">${l}</p>`).join("");
  const P = PKGS[pkg];
  $("#pane").innerHTML = `<div class="row"><h2>${esc(s.title)}</h2><span class="sp"></span><span class="note" id="snipMsg">Select any text, then snip it.</span><button class="btn primary" id="snipSel">✂ Snip selection</button><span class="eyebrow">${P.lensMode} lens</span></div>
  <div class="lens"><article class="reading"><div class="url">${esc(s.url || "pasted text")} · captured ${esc(project.captured)}</div>${paras}</article>
  <div class="keys"><h3>${pkg === "pro" ? "Pulled from this page" : "What to learn here"}</h3>${rows.length ? rows.map(({ t, r }) => `<div class="key"><span class="t">${esc(P.objects[t].label)}</span>${esc(summary(t, r))}</div>`).join("") : `<p class="note">Nothing extracted from this page yet.</p>`}
  <p class="note">Highlighted text is the exact evidence behind each extracted object.</p></div></div>`;
  if (ui.focusQuote) { const m = [...document.querySelectorAll("mark")].find(x => x.dataset.q === ui.focusQuote); if (m) { m.classList.add("flash"); m.scrollIntoView({ block: "center" }); } ui.focusQuote = null; }
}
function summary(t, r) {
  const f = Object.keys(PKGS[pkg].objects[t].fields);
  return f.slice(0, 3).map(k => r[k]).filter(v => v && v !== "not found").join(" · ");
}

$("#headExport").onclick = () => { ui.tab = "deliv"; render(); };
function openPkg(k) { if (k !== pkg) { pkg = k; store.set("fw-pkg", pkg); loadProject(); ui.steps = []; ui.msg = null; ui.layout = null; ui.groupBy = null; } ui.tab = "deliv"; render(); window.scrollTo(0, 0); }
$("#srcList").addEventListener("click", e => { const b = e.target.closest("[data-src]"); if (b) { ui.src = b.dataset.src; ui.tab = "lens"; render(); } });
$("#pane").addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-layout]")) { ui.layout = t.closest("[data-layout]").dataset.layout; renderScrap(); return; }
  if (t.closest("[data-snip]")) { const x = allSnips().find(z => z.id === t.closest("[data-snip]").dataset.snip); if (x) { ui.src = x.r.source; ui.focusQuote = x.r.verified ? x.r.quote : null; ui.tab = "lens"; render(); } return; }
  if (t.closest("[data-open]")) { openPkg(t.closest("[data-open]").dataset.open); return; }
  if (t.closest("[data-tplgo]")) { ui.tpl = +t.closest("[data-tplgo]").dataset.tplgo; project.request = PKGS[pkg].templates[ui.tpl].req; ui.tab = "extract"; render(); return; }
  if (t.closest("[data-go]")) { ui.tab = t.closest("[data-go]").dataset.go; render(); return; }
  if (t.closest("[data-bill]")) { ui.bill = t.closest("[data-bill]").dataset.bill; render(); return; }
  if (t.closest("[data-choose]")) { ui.choose = t.closest("[data-choose]").dataset.choose; renderCheckout(); return; }
  if (t.id === "startTrial") { $("#trialMsg").textContent = "This is a prototype, so no trial starts and nothing is charged. At launch, this button opens secure checkout."; return; }
  if (t.closest("[data-tpl]")) { ui.tpl = +t.closest("[data-tpl]").dataset.tpl; project.request = PKGS[pkg].templates[ui.tpl].req; renderExtract(); return; }
  if (t.closest("[data-obj]")) { ui.obj = t.closest("[data-obj]").dataset.obj; renderData(); return; }
  if (t.closest("[data-row]")) { const r = project.result.objects[ui.obj][+t.closest("[data-row]").dataset.row]; ui.src = r.source; ui.focusQuote = r.quote; ui.tab = "lens"; render(); return; }
  if (t.closest("[data-fc]")) { const i = +t.closest("[data-fc]").dataset.fc; ui.flipped[i] = !ui.flipped[i]; renderDeliv(); return; }
  if (t.closest("[data-exp]")) { doExport(t.closest("[data-exp]").dataset.exp, t.closest("[data-exp]")); return; }
  if (t.id === "run") { runExtraction(); return; }
  if (t.id === "stop") { ctl?.abort(); return; }
});
$("#pane").addEventListener("change", e => { if (e.target.id === "groupBy") { ui.groupBy = e.target.value; renderScrap(); } });
// Capture the selection before the click clears it
$("#pane").addEventListener("mousedown", e => {
  if (!e.target.closest("#snipSel")) return; e.preventDefault();
  const sel = window.getSelection(), txt = String(sel || "").replace(/\s+/g, " ").trim();
  const inReading = sel.rangeCount && document.querySelector(".reading")?.contains(sel.getRangeAt(0).commonAncestorContainer);
  const msg = $("#snipMsg");
  if (!txt || !inReading) { msg.textContent = "Select some text on the page first."; return; }
  project.snips = project.snips || []; project.snips.push({ text: txt.slice(0, 400), source: ui.src || project.sources[0].id });
  saveProject(); sel.removeAllRanges(); $("#nSnips").textContent = allRows().length + project.snips.length;
  msg.textContent = `Snipped. You have ${project.snips.length} snip${project.snips.length === 1 ? "" : "s"} of your own in the Scrapbook.`;
});
$("#pane").addEventListener("input", e => { if (e.target.id === "req") project.request = e.target.value; });
$("#addSrc").onclick = () => { $("#addForm").reset(); $("#addDlg").showModal(); };
$("#addDlg").addEventListener("close", () => {
  if ($("#addDlg").returnValue !== "add") return;
  const ids = project.sources.map(s => +s.id.slice(1)); const id = "S" + (Math.max(0, ...ids) + 1);
  project.sources.push({ id, title: $("#aTitle").value.trim(), url: $("#aUrl").value.trim(), text: $("#aText").value.trim() });
  ui.src = id; ui.tab = "lens"; saveProject(); render();
});
$("#resetProj").onclick = () => { project = clone(EXAMPLES[pkg]); project.captured = CAPTURED; verifyAll(); saveProject(); ui.steps = []; ui.msg = null; ui.src = project.sources[0].id; render(); };

/* ---------- AI extraction ---------- */
let sampleFn = null, dl = null, ctl = null;
(async () => { if (!window.claude?.use) return; [sampleFn, dl] = await Promise.all(["sample", "downloads"].map(n => claude.use(n).catch(() => null))); })();
function setStep(i, state) { ui.steps.forEach((s, j) => { if (j < i) s.state = "done"; else if (j === i) s.state = state || "now"; else s.state = ""; }); if (ui.tab === "extract") renderExtract(); }
async function runExtraction() {
  const use = [...document.querySelectorAll("[data-use]:checked")].map(x => x.dataset.use);
  const srcs = project.sources.filter(s => use.includes(s.id));
  if (!srcs.length) { ui.msg = { err: true, text: "Pick at least one page." }; renderExtract(); return; }
  if (!sampleFn) { ui.msg = { err: true, text: "Live AI extraction runs when this page is open in claude.ai. The results shown are an example of what it produces." }; renderExtract(); return; }
  const P = PKGS[pkg];
  ui.running = true; ui.msg = null;
  ui.steps = [{ text: `Reading ${srcs.length} page${srcs.length > 1 ? "s" : ""}` }, { text: "Extracting objects and evidence" }, { text: "Checking every quote against the page" }, { text: "Building your deliverable" }];
  setStep(0); setTimeout(() => ui.running && ui.steps[1].state !== "done" && setStep(1), 1800);
  const shape = Object.fromEntries(Object.entries(P.objects).map(([k, o]) => [k, [Object.fromEntries([...Object.keys(o.fields).map(f => [f, "…"]), ["source", "S1"], ["quote", "exact words from the page"]])]]));
  const prompt = `You are Fieldwork, an extraction tool for ${pkg === "pro" ? "business intelligence for professionals" : "students doing research"}.
Extract structured objects ONLY from the sources below. Never invent facts or use outside knowledge.
Every object must include "source" (the source id, like S1) and "quote" (an exact, verbatim excerpt from that source, under 30 words, that proves the object). Copy the quote character for character.
If a field is not stated in the source, write "not found".
${pkg === "student" ? 'For "citation", write an APA 7 reference from the byline (author, year, title, publisher).' : 'For prices, keep the currency symbol. "per_serving" is the unit price if the page states one.'}

The user's request: ${project.request}

Sources:
${srcs.map(s => `[${s.id}] ${s.title} (${s.url || "pasted text"})\n${s.text.slice(0, 12000)}`).join("\n\n")}

Reply with only JSON in this shape:
{"objects": ${JSON.stringify(shape)}, "deliverable": {"title": "…", "summary": "2 sentences", "sections": [{"h": "heading", "bullets": ["…"]}]}}
The deliverable answers the user's request in 3 to 6 sections, using only facts from the objects. Label any section of your own analysis "(analysis)".`;
  ctl = new AbortController();
  try {
    const r = await sampleFn.json(prompt, { signal: ctl.signal, cache: false, modelTier: "default" });
    if (!r || !r.objects || !r.deliverable) throw { code: "bad_shape" };
    setStep(2);
    const objects = {}; Object.keys(P.objects).forEach(k => objects[k] = (Array.isArray(r.objects[k]) ? r.objects[k] : []).filter(x => x && typeof x === "object"));
    project.result = { by: "ai", objects, deliverable: { title: String(r.deliverable.title || "Report"), summary: String(r.deliverable.summary || ""), sections: (r.deliverable.sections || []).map(s => ({ h: String(s.h || ""), bullets: (s.bullets || []).map(String) })) } };
    project.captured = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    verifyAll(); saveProject();
    const rows = allRows(), ver = rows.filter(x => x.verified).length;
    setStep(4); ui.running = false;
    ui.msg = { text: `Done. ${rows.length} objects extracted, ${ver} matched word for word to the page. Rows marked “Check” need a look.` };
    render();
  } catch (e) {
    ui.running = false; ui.steps = [];
    ui.msg = e?.code === "cancelled" ? { text: "Stopped. Your previous results are unchanged." } : { err: true, text: { not_granted: "Fieldwork needs permission to use Claude. Allow it from this page's permissions, then run again.", rate_limited: "Too many requests at once. Wait a moment, then run again.", bad_shape: "The extraction came back incomplete. Try again, or use fewer pages." }[e?.code] || "The extraction didn't finish. Try again." };
    render();
  }
}

/* ---------- Exports: PDF, PowerPoint, Excel, CSV ---------- */
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
const srcTitle = id => project.sources.find(s => s.id === id)?.title || id;
const srcUrl = id => project.sources.find(s => s.id === id)?.url || "";
function datasetRows(t) {
  const f = PKGS[pkg].objects[t].fields;
  return (project.result?.objects?.[t] || []).map(r => ({ ...Object.fromEntries(Object.entries(f).map(([k, l]) => [l, r[k] ?? ""])), "Source": srcTitle(r.source), "URL": srcUrl(r.source), "Evidence quote": r.quote, "Matched to page": r.verified ? "Yes" : "Check", "Captured": project.captured }));
}
function buildXlsx() {
  const wb = XLSX.utils.book_new();
  Object.entries(PKGS[pkg].objects).forEach(([k, o]) => { const ws = XLSX.utils.json_to_sheet(datasetRows(k)); ws["!cols"] = Object.keys(datasetRows(k)[0] || { a: 1 }).map(h => ({ wch: /quote/i.test(h) ? 60 : 22 })); XLSX.utils.book_append_sheet(wb, ws, o.label.slice(0, 31)); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(project.sources.map(s => ({ ID: s.id, Title: s.title, URL: s.url, Captured: project.captured }))), "Pages captured");
  return new Blob([XLSX.write(wb, { bookType: "xlsx", type: "array" })]);
}
function toCsv(rows) { if (!rows.length) return ""; const h = Object.keys(rows[0]); const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`; return [h.map(q).join(","), ...rows.map(r => h.map(k => q(r[k])).join(","))].join("\n"); }
function buildPdf() {
  const d = project.result.deliverable, { jsPDF } = window.jspdf, doc = new jsPDF({ unit: "pt", format: "letter" });
  const M = 54, W = 612 - M * 2; let y = M;
  const need = h => { if (y + h > 792 - M) { doc.addPage(); y = M; } };
  const text = (t, size, style, gap, color) => { doc.setFont("helvetica", style || "normal"); doc.setFontSize(size); doc.setTextColor(...(color || [20, 32, 26])); const lines = doc.splitTextToSize(String(t), W); lines.forEach(l => { need(size * 1.35); doc.text(l, M, y); y += size * 1.35; }); y += gap || 0; };
  text("FIELDWORK  |  " + (pkg === "pro" ? "REPORT" : "STUDY GUIDE"), 8, "bold", 14, [53, 97, 140]);
  text(d.title, 20, "bold", 8); text(d.summary, 11, "normal", 12);
  if (pkg === "pro" && project.result.objects.price?.length) {
    text("Price comparison", 13, "bold", 4);
    project.result.objects.price.forEach(r => text(`${r.company}, ${r.plan}: ${r.price} ${r.period}${r.per_serving && r.per_serving !== "not found" ? ` (${r.per_serving} per unit)` : ""}, ${r.includes}`, 10, "normal", 1));
    y += 8;
  }
  d.sections.forEach(s => { need(40); text(s.h, 13, "bold", 4); s.bullets.forEach(b => text("•  " + b, 10.5, "normal", 2)); y += 8; });
  if (pkg === "student") { text("Flashcards", 13, "bold", 4); flashcards().forEach(c => { text(c.f, 10, "bold", 0); text("Answer: " + c.b, 10, "normal", 5); }); y += 8; }
  text("Sources", 13, "bold", 4);
  project.sources.forEach((s, i) => text(`${i + 1}. ${s.title}. ${s.url || "pasted text"}. Captured ${project.captured}.`, 9.5, "normal", 1, [93, 107, 99]));
  return doc.output("blob");
}
async function buildPptx() {
  const d = project.result.deliverable, p = new PptxGenJS(); p.layout = "LAYOUT_WIDE";
  const ACC = "35618C", INK = "14201A";
  let s = p.addSlide(); s.background = { color: ACC };
  s.addText("FIELDWORK", { x: 0.6, y: 0.5, w: 6, h: 0.4, fontFace: "Arial", fontSize: 12, bold: true, color: "FFFFFF" });
  s.addText(d.title, { x: 0.6, y: 2.2, w: 12, h: 1.4, fontFace: "Arial", fontSize: 36, bold: true, color: "FFFFFF" });
  s.addText(d.summary, { x: 0.6, y: 3.7, w: 11.5, h: 1.4, fontFace: "Arial", fontSize: 16, color: "E3ECF5" });
  d.sections.forEach(sec => { const sl = p.addSlide(); sl.addText(sec.h, { x: 0.6, y: 0.4, w: 12, h: 0.8, fontFace: "Arial", fontSize: 28, bold: true, color: INK }); sl.addShape(p.ShapeType.rect, { x: 0.6, y: 1.2, w: 1.2, h: 0.06, fill: { color: ACC } }); sl.addText(sec.bullets.map(b => ({ text: b, options: { bullet: true, breakLine: true } })), { x: 0.6, y: 1.5, w: 12, h: 5, fontFace: "Arial", fontSize: 18, color: INK, valign: "top", paraSpaceAfter: 10 }); });
  const tableRows = pkg === "pro" ? (project.result.objects.price || []).map(r => [r.company, r.plan, r.price, r.per_serving || "not found", r.includes]) : (project.result.objects.term || []).map(r => [r.term, r.definition]);
  if (tableRows.length) {
    const head = pkg === "pro" ? ["Company", "Plan", "Price / week", "Unit price", "Includes"] : ["Term", "Definition"];
    const sl = p.addSlide(); sl.addText(pkg === "pro" ? "Price comparison" : "Key terms", { x: 0.6, y: 0.4, w: 12, h: 0.8, fontFace: "Arial", fontSize: 28, bold: true, color: INK });
    sl.addTable([head.map(h => ({ text: h, options: { bold: true, color: "FFFFFF", fill: { color: ACC } } })), ...tableRows.map(r => r.map(String))], { x: 0.6, y: 1.4, w: 12.1, fontFace: "Arial", fontSize: 13, color: INK, border: { type: "solid", pt: 0.5, color: "DBE2DC" } });
  }
  const sl = p.addSlide(); sl.addText("Sources", { x: 0.6, y: 0.4, w: 12, h: 0.8, fontFace: "Arial", fontSize: 28, bold: true, color: INK });
  sl.addText(project.sources.map(x => ({ text: `${x.title}, ${x.url || "pasted text"}, captured ${project.captured}`, options: { bullet: true, breakLine: true } })), { x: 0.6, y: 1.4, w: 12, h: 5, fontFace: "Arial", fontSize: 14, color: "5D6B63", valign: "top" });
  return await p.write({ outputType: "blob" });
}
async function doExport(kind, btn) {
  const say = t => { const m = document.querySelector("#expMsg"); if (m) m.textContent = t; else btn.title = t; };
  if (!project.result) { say("Run Extract first."); return; }
  const base = slug(project.result.deliverable?.title || project.name);
  let file;
  try {
    if (kind === "pdf") file = { filename: base + ".pdf", data: buildPdf() };
    else if (kind === "pptx") file = { filename: base + ".pptx", data: await buildPptx() };
    else if (kind === "xlsx") file = { filename: slug(project.name) + "-datasets.xlsx", data: buildXlsx() };
    else if (kind === "csv") file = { filename: slug(project.name) + "-" + ui.obj + ".csv", data: toCsv(datasetRows(ui.obj)) };
    else if (kind === "snips") file = { filename: slug(project.name) + "-snips.csv", data: toCsv(allSnips().map(x => ({ Group: groupOf(x), Snip: x.text, Type: x.type, Source: srcTitle(x.r.source), URL: srcUrl(x.r.source), "Evidence quote": x.r.quote, "Matched to page": x.r.verified ? "Yes" : "Check" }))) };
    else if (kind === "cards") file = { filename: slug(project.name) + "-flashcards.csv", data: toCsv(flashcards().map(c => ({ Front: c.f, Back: c.b, Type: c.t }))) };
  } catch (e) { say("Couldn't build the file. Reload the page and try again."); return; }
  window.__lastExport = file;
  ui.exportsLog.push({ name: file.filename, when: new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) });
  if (!dl) { say(`${file.filename} is ready. Downloads work when this page is open in claude.ai.`); return; }
  try { await dl.save(file); say(`Saved ${file.filename}.`); }
  catch (e) { say(e?.code === "declined" ? "Download cancelled." : e?.code === "rate_limited" ? "Another download is waiting. Try again in a moment." : "Downloads aren't available in this view."); }
}

loadProject(); render();
</script>
