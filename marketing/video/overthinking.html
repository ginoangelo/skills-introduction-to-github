<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Aimed: 3 a.m. overthinking</title>
<style>
  /* 1080x1920, 15 seconds. Driven frame by frame by render(t) from render-video.cjs. */
  @font-face { font-family: Jakarta; font-weight: 800; src: url("../../mobile/node_modules/@expo-google-fonts/plus-jakarta-sans/800ExtraBold/PlusJakartaSans_800ExtraBold.ttf"); }
  @font-face { font-family: Jakarta; font-weight: 700; src: url("../../mobile/node_modules/@expo-google-fonts/plus-jakarta-sans/700Bold/PlusJakartaSans_700Bold.ttf"); }
  @font-face { font-family: Inter; font-weight: 500; src: url("../../mobile/node_modules/@expo-google-fonts/inter/500Medium/Inter_500Medium.ttf"); }
  @font-face { font-family: Inter; font-weight: 600; src: url("../../mobile/node_modules/@expo-google-fonts/inter/600SemiBold/Inter_600SemiBold.ttf"); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #07050b; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(120% 80% at 50% 45%, #1a1024 0%, #0b0710 60%, #050307 100%); font-family: Inter, sans-serif; }
  #glow { position: absolute; left: 50%; top: 50%; width: 1400px; height: 1400px; margin: -760px 0 0 -700px; border-radius: 50%; background: radial-gradient(circle, rgba(143, 87, 234, .55) 0%, rgba(255, 154, 107, .18) 38%, rgba(0, 0, 0, 0) 70%); opacity: 0; }
  #clock { position: absolute; left: 0; right: 0; top: 150px; text-align: center; color: #fff; }
  #clock .time { font-family: Jakarta; font-weight: 800; font-size: 132px; letter-spacing: -4px; line-height: 1; }
  #clock .sub { font-size: 38px; font-weight: 500; opacity: .6; margin-top: 14px; }
  #phone { position: absolute; left: 50%; top: 400px; width: 560px; height: 1110px; margin-left: -280px; border-radius: 80px; border: 18px solid #1b1320; background: #000; overflow: hidden; box-shadow: 0 0 0 2px #2a2030; transform-origin: 50% 60%; }
  .screen { position: absolute; inset: 0; }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  #story { opacity: 0; }
  #read { transform: translateY(100%); background: #fffaf6; }
  #views { position: absolute; right: 26px; top: 64px; background: rgba(20, 10, 30, .6); color: #fff; font-weight: 600; font-size: 24px; padding: 10px 18px; border-radius: 999px; opacity: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #caption { position: absolute; left: 80px; right: 80px; top: 1260px; display: flex; justify-content: center; }
  #caption span { background: rgba(18, 10, 26, .78); color: #fff; font-family: Jakarta; font-weight: 800; font-size: 60px; line-height: 1.15; letter-spacing: -1.5px; padding: 26px 38px; border-radius: 32px; text-align: center; max-width: 920px; }
  #end { position: absolute; inset: 0; background: #7a3ed6; color: #fff; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; padding-bottom: 260px; }
  .mark { width: 150px; height: 150px; border-radius: 42px; background: #fff; position: relative; }
  .mark::before, .mark::after { content: ""; position: absolute; left: 32px; height: 18px; border-radius: 9px; }
  .mark::before { top: 46px; width: 86px; background: #7a3ed6; }
  .mark::after { top: 84px; width: 54px; background: #ffb48a; }
  #end .name { font-family: Jakarta; font-weight: 800; font-size: 140px; letter-spacing: -5px; line-height: 1; }
  #end .tag { font-size: 48px; font-weight: 500; opacity: .9; }
  #end .cta { margin-top: 30px; background: #fff; color: #1b1320; font-family: Jakarta; font-weight: 700; font-size: 52px; padding: 34px 70px; border-radius: 999px; }
  #note { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; color: rgba(255, 255, 255, .55); font-size: 26px; font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="clock"><div class="time">3:07 AM</div><div class="sub">Can't sleep.</div></div>
  <div id="phone">
    <div class="screen" id="story"><img src="../../mobile/assets/example-story.png" alt=""></div>
    <div class="screen" id="read"><img src="../source/r-clean.png" alt=""></div>
    <div id="views">Viewed 14 times</div>
    <div id="flash"></div>
  </div>
  <div id="caption"><span id="captionText"></span></div>
  <div id="end">
    <div class="mark"></div>
    <div class="name">Aimed</div>
    <div class="tag">Read between the lines.</div>
    <div class="cta">Try it free</div>
  </div>
  <div id="note">Example post, made up for this video.</div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const CAPTIONS = [
    [1.1, 3.0, "You've reread her story 14 times."],
    [3.0, 5.8, "Is it about you? Is it not?"],
    [5.8, 7.4, "Screenshot it."],
    [7.6, 11.6, "Get the read. With the evidence."],
  ];

  // Draw the frame at time t (seconds).
  window.render = function (t) {
    // Fade in from black, clock appears.
    $("stage").style.opacity = ease(seg(t, 0, 0.6));
    $("clock").style.opacity = ease(seg(t, 0.2, 0.9)) * (1 - seg(t, 11.4, 11.8));

    // Phone lights up at 1s, glow follows.
    const on = ease(seg(t, 0.9, 1.3));
    $("story").style.opacity = on;
    $("glow").style.opacity = on * (0.75 + 0.25 * Math.sin(t * 2.2));
    $("phone").style.boxShadow = `0 0 0 2px #2a2030, 0 0 ${140 * on}px rgba(143,87,234,${0.55 * on})`;

    // Slow push-in while she overthinks, then a shutter pulse on the screenshot.
    const push = 1 + 0.06 * ease(seg(t, 1.2, 6.2));
    const shutter = t > 6.3 && t < 6.7 ? 1 - 0.025 * Math.sin(seg(t, 6.3, 6.7) * Math.PI) : 1;
    $("phone").style.transform = `scale(${push * shutter})`;

    // View counter ticks up 14 to 17.
    $("views").style.opacity = ease(seg(t, 3.1, 3.4)) * (1 - seg(t, 6.3, 6.5));
    $("views").textContent = `Viewed ${14 + Math.min(3, Math.floor(seg(t, 3.4, 5.6) * 4))} times`;

    // Screenshot flash, then the Aimed read slides up.
    $("flash").style.opacity = t < 6.35 ? 0 : 1 - seg(t, 6.35, 6.8);
    const up = ease(seg(t, 7.0, 7.7));
    $("read").style.transform = `translateY(${(1 - up) * 100}%)`;
    $("read").querySelector("img").style.objectPosition = `50% ${6 * ease(seg(t, 8.2, 11.2))}%`;

    // Captions, each with a quick fade and lift.
    let text = "", alpha = 0, lift = 0;
    for (const [a, b, c] of CAPTIONS) {
      if (t >= a && t < b) {
        text = c;
        alpha = Math.min(seg(t, a, a + 0.25), 1 - seg(t, b - 0.2, b));
        lift = (1 - ease(seg(t, a, a + 0.3))) * 24;
      }
    }
    $("captionText").textContent = text;
    $("caption").style.opacity = text ? alpha : 0;
    $("caption").style.transform = `translateY(${lift}px)`;

    // End card.
    const end = ease(seg(t, 11.6, 12.2));
    $("end").style.opacity = end;
    $("end").style.transform = `scale(${1.04 - 0.04 * end})`;
    $("note").style.opacity = end;
  };
  window.render(0);
</script>
</body>
</html>
