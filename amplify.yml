# AWS Amplify Hosting build settings for the Deeper News website.
# The app lives in the deeper-news-app folder of this repository.
version: 1
applications:
  - appRoot: deeper-news-app
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci
        build:
          commands:
            - npx expo export --platform web
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
